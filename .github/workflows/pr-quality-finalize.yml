name: PR Quality Finalize

on:
  workflow_run:
    workflows: [PR Quality Analysis]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  checks: write

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success'
    name: verified review and exact-head Check Run
    runs-on: [self-hosted, macOS]
    steps:
      # Trusted code only. Never checkout PR head in this job.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install trusted control-plane code
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: pr-quality-analysis-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/pr-quality-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify provenance then run reasoning-only panel
        env:
          PR_REPOSITORY: ${{ github.repository }}
          SOURCE_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node console/backend/bin/platform.ts pr-gate finalize \
            --artifact "$RUNNER_TEMP/pr-quality-artifact/pr-quality-analysis.json" \
            --repo "$PR_REPOSITORY" \
            --workflow-run-id "$SOURCE_WORKFLOW_RUN_ID" \
            --source-head "$SOURCE_WORKFLOW_HEAD_SHA"
