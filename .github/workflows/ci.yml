name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        # npm install (not npm ci): npm ci's strict ideal-tree reconciliation is
        # sensitive to the node/npm version that authored package-lock.json vs the
        # runner's, and this repo's lock predates a pinned Node version. npm install
        # mirrors the actual local workflow (task-gate runs `npm test` on an
        # npm-install tree) and still installs from the committed lockfile.
        # Follow-up: add .nvmrc, regenerate the lock with that Node, restore `npm ci`.
        run: npm install --no-audit --no-fund
      - name: Audit dependencies
        # Dependency rules (CLAUDE.md): vulnerability audit is part of CI. Blocking at
        # high/critical so the SECURITY_RULES claim ("CI runs npm audit") is actually true.
        # Full tree (no --omit=dev): the dev-tooling advisories that once forced a prod-only
        # gate (esbuild via vite/vitest, postcss via next) are cleared in #31 — vitest 4 ->
        # vite 8 (rolldown, no esbuild) + a postcss>=8.5.10 override — so the whole tree now
        # gates clean and any regression (dev OR prod) reds the build. If a future transitive
        # DEV-only advisory with no non-breaking fix starts blocking unrelated PRs, scope back
        # to `--omit=dev` and track it separately (the original #25 rationale).
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Guard regression tests
        # Tier 1 floor: the single check engine (.ai/bin/check-*.sh) is exercised by its
        # adversarial test suite here so it cannot drift / be weakened silently — a loosened
        # guard fails its own paired block/allow case and reds the build. Runs EVERY
        # *.test.sh under .claude/hooks/tests/ (destructive, hook-bypass, secrets, gate-task).
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=( .claude/hooks/tests/*.test.sh )
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No guard tests found under .claude/hooks/tests/ — expected the suite." >&2
            exit 1
          fi
          status=0
          for t in "${tests[@]}"; do
            echo "::group::guard-test ${t}"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Secret scan
        # Tier 1 floor: full-tree secret scan (single source: .ai/bin/check-secrets.sh).
        # --all scans the whole tree (not just a staged diff) so CI catches anything that
        # slipped past a local pre-commit hook or was committed without core.hooksPath set.
        # SECRET_GUARD_SKIP is force-cleared here so a stray env value cannot neuter the
        # CI scan (the local-only human override must not exist in the floor).
        env:
          SECRET_GUARD_SKIP: ''
        run: .ai/bin/check-secrets.sh --all
      - name: Setup Python
        # Pin the interpreter the REQ-coverage step relies on (spec_trace.py) instead of
        # whatever python3 the runner image happens to ship.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Spec trace (REQ coverage)
        # Tier 1 floor: every REQ in each feature's requirements.md must be referenced in
        # design.md and tasks.md. Fails the build on any uncovered REQ. Runs once per
        # feature dir under .claude/specs/ (skips dirs without a requirements.md, e.g. .gitkeep).
        run: |
          set -euo pipefail
          status=0
          for dir in .claude/specs/*/; do
            [ -f "${dir}requirements.md" ] || continue
            feature="$(basename "$dir")"
            echo "::group::spec-trace ${feature}"
            scripts/spec-trace.sh "$feature" || status=1
            echo "::endgroup::"
          done
          exit "$status"
