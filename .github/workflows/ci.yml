name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        # npm install (not npm ci): npm ci's strict ideal-tree reconciliation is
        # sensitive to the node/npm version that authored package-lock.json vs the
        # runner's, and this repo's lock predates a pinned Node version. npm install
        # mirrors the actual local workflow (task-gate runs `npm test` on an
        # npm-install tree) and still installs from the committed lockfile.
        # Follow-up: add .nvmrc, regenerate the lock with that Node, restore `npm ci`.
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Secret scan
        # Tier 1 floor: full-tree secret scan (single source: .ai/bin/check-secrets.sh).
        # --all scans the whole tree (not just a staged diff) so CI catches anything that
        # slipped past a local pre-commit hook or was committed without core.hooksPath set.
        run: .ai/bin/check-secrets.sh --all
      - name: Spec trace (REQ coverage)
        # Tier 1 floor: every REQ in each feature's requirements.md must be referenced in
        # design.md and tasks.md. Fails the build on any uncovered REQ. Runs once per
        # feature dir under .claude/specs/ (skips dirs without a requirements.md, e.g. .gitkeep).
        run: |
          set -euo pipefail
          status=0
          for dir in .claude/specs/*/; do
            [ -f "${dir}requirements.md" ] || continue
            feature="$(basename "$dir")"
            echo "::group::spec-trace ${feature}"
            scripts/spec-trace.sh "$feature" || status=1
            echo "::endgroup::"
          done
          exit "$status"
