name: PR Quality Analysis

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: unprivileged snapshot and deterministic checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Control-plane code and dependencies come from trusted base. Analyzer fetches exact PR object separately.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build untrusted analysis artifact
        env:
          PR_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node console/backend/bin/platform.ts pr-gate analyze \
            --repo "$PR_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --out "$RUNNER_TEMP/pr-quality-analysis.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-quality-analysis-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-quality-analysis.json
          if-no-files-found: error
          retention-days: 1
