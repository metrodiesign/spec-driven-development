<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platform Console</title>
    <script>
      // ponytail: duplicates logic/theme.ts's resolveInitialTheme (tiny, inline,
      // runs before first paint) so dark-preferring operators don't see a flash
      // of the light theme. Keep both in sync if the storage key/rule changes.
      (function () {
        var stored = localStorage.getItem('console-theme');
        var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
