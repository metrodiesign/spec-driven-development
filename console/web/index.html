<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platform Console</title>
    <script>
      // ponytail: tiny inline bootstrap prevents theme/locale flash. Keep storage
      // keys and fallback rules in sync with logic/theme.ts and logic/i18n.ts.
      (function () {
        var theme = null;
        var locale = null;
        try {
          theme = localStorage.getItem('console-theme');
          locale = localStorage.getItem('console-locale');
        } catch (_) {
          // Storage-disabled browsers keep preferences in memory after React mounts.
        }
        theme = theme === 'light' || theme === 'dark' ? theme : 'dark';
        locale = locale === 'th' || locale === 'en'
          ? locale
          : ((navigator.language || '').toLowerCase().startsWith('th') ? 'th' : 'en');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-locale', locale);
        document.documentElement.lang = locale;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
